spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:55433/hotel_chain_test}
    username: ${TEST_DATABASE_USER:hotel_test}
    password: ${TEST_DATABASE_PASSWORD:hotel_test}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0

test-payment:
  enabled: true

payment:
  provider: fake

reservation:
  change:
    settlement-enabled: false
    gateway: fake

hotel:
  seed:
    # 테스트는 0원·0일·0객실을 거부하는 검증을 직접 하므로 유효한 기본값을 둔다.
    default-rate-krw: 100000
    rate-days: 90
    inventory-capacity: 8
