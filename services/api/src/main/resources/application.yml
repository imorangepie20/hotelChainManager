spring:
  application:
    name: hotel-chain-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/hotel_chain}
    username: ${DATABASE_USER:hotel_app}
    password: ${DATABASE_PASSWORD:hotel_local_only}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

server:
  port: 4080

reservation:
  hold-ttl: ${RESERVATION_HOLD_TTL:10m}

website:
  media:
    storage-dir: ${WEBSITE_MEDIA_STORAGE_DIR:}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health
