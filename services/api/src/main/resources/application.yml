spring:
  application:
    name: hotel-chain-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/hotel_chain}
    username: ${DATABASE_USER:hotel_app}
    password: ${DATABASE_PASSWORD:hotel_local_only}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

server:
  port: 4080

reservation:
  hold-ttl: ${RESERVATION_HOLD_TTL:10m}
  change:
    settlement-enabled: ${RESERVATION_CHANGE_SETTLEMENT_ENABLED:false}
    gateway: ${RESERVATION_CHANGE_GATEWAY:disabled}
    direct-limit-krw: 100000
    approval-ttl: 24h
    hold-ttl: 15m

policy:
  cancellation:
    refund-cutoff-days-before: ${POLICY_CANCELLATION_CUTOFF_DAYS:1}
    refund-cutoff-local-time: ${POLICY_CANCELLATION_CUTOFF_TIME:18:00}

payment:
  provider: ${PAYMENT_PROVIDER:fake}
  checkout-enabled: ${PAYMENT_CHECKOUT_ENABLED:false}
  toss:
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
    merchant-account: ${TOSS_PAYMENTS_MERCHANT_ACCOUNT:}
    customer-origin: ${PAYMENT_CUSTOMER_ORIGIN:http://127.0.0.1:4000}
    webhook-max-per-second: ${TOSS_WEBHOOK_MAX_PER_SECOND:120}
    settlement-enabled: ${TOSS_SETTLEMENT_ENABLED:false}
    settlement-page-size: ${TOSS_SETTLEMENT_PAGE_SIZE:500}
    settlement-delay-days: ${TOSS_SETTLEMENT_DELAY_DAYS:2}

website:
  media:
    storage-dir: ${WEBSITE_MEDIA_STORAGE_DIR:}
    storage:
      mode: ${WEBSITE_MEDIA_STORAGE_MODE:local}
      s3:
        endpoint: ${WEBSITE_MEDIA_S3_ENDPOINT:}
        region: ${WEBSITE_MEDIA_S3_REGION:}
        bucket: ${WEBSITE_MEDIA_S3_BUCKET:}
        path-style: ${WEBSITE_MEDIA_S3_PATH_STYLE:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health
