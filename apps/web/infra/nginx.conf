server {
    # 80·8080 은 쓰지 않는다. 서버의 다른 서비스와 겹치지 않도록
    # 프로젝트 전용 대역인 3110 을 컨테이너 포트로 쓴다.
    listen 3110;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 를 백엔드 컨테이너로 보낸다. 환경변수로 런타임에 교체한다.
    # 고객 웹이 상대 경로 fetch('/api/...') 를 쓰므로 같은 도메인이어야 한다.
    location /api/ {
        proxy_pass ${API_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 터널이 https 로 들어오므로 백엔드에게 공개 스키마를 알려준다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    # 미디어 파일. API 컨테이너가 서비스한다.
    location /media/ {
        proxy_pass ${API_PROXY_TARGET};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 브라우저 새로고침에 404 가 나지 않게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 캐시. 파일 이름에 해시가 있으므오 오래 캐시해도 된다.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 항상 새로 읽는다.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
